<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>누비백 브랜드 / 매장 안내</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. 헤더 / 상단 네비게이션 -->
  <header class="header">
    <div class="logo">BRAND NAME</div>
    <nav class="nav">
      <a href="#about">ABOUT</a>
      <a href="#products">PRODUCTS</a>
      <a href="#access">ACCESS</a>
    </nav>
  </header>

  <!-- 2. 메인 비주얼 (Hero Section) -->
  <section class="hero">
    <div class="hero-text">
      <h1>부산의 온기를 담은 누비백</h1>
      <p>HANDMADE NUBI BAG FROM BUSAN</p>
    </div>
  </section>

  <!-- 3. 제품 소개 (Products) -->
  <section id="products" class="section">
    <h2>PRODUCTS</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="images/product1.jpg" alt="누비백 제품 1">
        <h3>Nubi Tote Bag</h3>
        <p>가볍고 포근한 누비 소재의 토트백입니다.</p>
      </div>
      <!-- 추가 제품 카드는 복사해서 사용 -->
    </div>
  </section>

  <!-- 4. 가게 위치 & LINE 상담 (Access & Contact) -->
  <section id="access" class="section access-section">
    <h2>STORE LOCATION & CONTACT</h2>
    <p>부산 국제시장에 위치한 오프라인 매장 안내입니다.</p>
    
    <!-- 구글 지도 퍼가기 (Embed) -->
    <div class="map-container">
      <iframe src="https://www.google.com/maps/embed?pb=YOUR_GOOGLE_MAPS_LINK" width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>

    <!-- LINE 상담 연결 버튼 -->
    <div class="line-cta">
      <p>제품 문의 및 일본 직배송 관련 상담은 공식 LINE으로 연락 주세요.</p>
      <a href="https://line.me/R/ti/p/@YOUR_LINE_ID" target="_blank" class="line-button">
        LINEで 문의하기 (LINE公式)
      </a>
    </div>
  </section>

  <!-- 5. 푸터 -->
  <footer class="footer">
    <p>&copy; 2026 Hanilbubu / Nubi Bag. All rights reserved.</p>
  </footer>

</body>
</html>
